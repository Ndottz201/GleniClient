plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral() // Essential for artifacts found on Maven Central
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "racoondog"
        url = "https://repo.repsy.io/mvn/racoondog/maven" // RacoonDog's personal repo
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    include 'org.projectlombok:lombok:1.18.30'

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // blame feather
    implementation("meteordevelopment:orbit:${project.orbit_version}")
    include("meteordevelopment:orbit:${project.orbit_version}")
    
    // Reverted back to your original correct ID
    implementation("io.github.racoondog:norbit:${project.norbit_version}")
    include("io.github.racoondog:norbit:${project.norbit_version}")
    
    implementation 'net.java.dev.jna:jna:5.13.0'

    // NanoVG
    implementation(platform("org.lwjgl:lwjgl-bom:3.3.3"))
    include(platform("org.lwjgl:lwjgl-bom:3.3.3"))

    implementation("org.lwjgl:lwjgl-nanovg")
    include("org.lwjgl:lwjgl-nanovg")

    runtimeOnly("org.lwjgl:lwjgl-nanovg::natives-windows")
    include("org.lwjgl:lwjgl-nanovg::natives-windows")
    runtimeOnly("org.lwjgl:lwjgl-nanovg::natives-macos")
    include("org.lwjgl:lwjgl-nanovg::natives-macos")
    runtimeOnly("org.lwjgl:lwjgl-nanovg::natives-macos-arm64")
    include("org.lwjgl:lwjgl-nanovg::natives-macos-arm64")
    runtimeOnly("org.lwjgl:lwjgl-nanovg::natives-linux")
    include("org.lwjgl:lwjgl-nanovg::natives-linux")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}